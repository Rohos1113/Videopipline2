<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="sunoSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E3A"/>
      <stop offset="50%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="#180F11"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="none" stroke="#FF5E3A" stroke-opacity="0.2"/>
  <!-- Suno sound sunburst disc -->
  <g transform="translate(24, 24)">
    <circle cx="0" cy="0" r="14" fill="url(#sunoSun)"/>
    <circle cx="0" cy="0" r="8" fill="#180F11"/>
    <circle cx="0" cy="0" r="3.5" fill="url(#sunoSun)"/>
    <!-- Sound groove arcs -->
    <circle cx="0" cy="0" r="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-dasharray="2 3"/>
