<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="topazTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="topazLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="topazRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="#0A111E"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="none" stroke="#0EA5E9" stroke-opacity="0.18"/>
  <!-- Topaz Labs precision diamond crystal -->
  <g transform="translate(24, 24)">
    <!-- Top crown table -->
    <polygon points="-8,-14 8,-14 13,-6 -13,-6" fill="url(#topazTop)"/>
    <!-- Center facet -->
    <polygon points="-13,-6 13,-6 0,15" fill="url(#topazLeft)"/>
    <!-- Left upper facet -->
    <polygon points="-13,-6 0,-6 0,15" fill="url(#topazRight)" fill-opacity="0.5"/>
    <!-- Right crown facet -->
    <polygon points="8,-14 13,-6 0,-6" fill="#BAE6FD" fill-opacity="0.7"/>
    <!-- Central T highlight -->
    <path d="M-6 -10 L6 -10 M0 -10 L0 -2" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
