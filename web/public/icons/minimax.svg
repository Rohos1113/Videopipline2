      <stop offset="0%" stop-color="#FF5757"/>
      <stop offset="50%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#9B51E0"/>
    </linearGradient>
    <linearGradient id="mmGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7676"/>
